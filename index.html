<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N5 & N4 Grammar Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow study column; sticky level switcher + progress; grouped checklists like a 問題集 */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2030; --muted:#5c6478; --line:#dde1ea;
  --ai:#2b3f8f; --ai-soft:#e6eaf7; --shu:#c2412d; --done:#8a91a3;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"IBM Plex Sans","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2a; --fg:#e7e9f0; --muted:#9aa2b6; --line:#2c3342;
  --ai:#8fa4ef; --ai-soft:#232c48; --shu:#ec7a63; --done:#6b7285; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2a; --fg:#e7e9f0; --muted:#9aa2b6; --line:#2c3342;
  --ai:#8fa4ef; --ai-soft:#232c48; --shu:#ec7a63; --done:#6b7285; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:.01em;text-wrap:balance}
header h1 span{color:var(--shu)}
header p{color:var(--muted);margin:6px 0 0;max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;margin-top:18px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:500 14px var(--f-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:var(--bg)}
.tab:focus-visible,.chk:focus-visible+label,.tool:focus-visible,input[type=search]:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 200px;min-width:0;font:15px var(--f-body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.tool{font:500 13px var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer}
.tool[aria-pressed="true"]{color:var(--ai);border-color:var(--ai)}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.p{display:grid;gap:4px}
.p .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.p .lbl b{color:var(--fg);font-weight:600}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--ai);width:0;transition:width .3s}
.p.n5 .fill{background:var(--shu)}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.level{margin-top:30px}
.level>h2{font-family:var(--f-display);font-weight:800;font-size:1.5rem;margin:0 0 4px;display:flex;align-items:baseline;gap:10px}
.level>h2 .tag{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.group{margin-top:18px}
.group h3{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
.chk{position:absolute;opacity:0;pointer-events:none}
label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:11px 14px;cursor:pointer;align-items:start}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;margin-top:2px;display:grid;place-items:center}
.box svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk:checked+label .box{background:var(--ai);border-color:var(--ai)}
.chk:checked+label .box svg{opacity:1}
.form{font-family:var(--f-jp);font-weight:700;font-size:16px}
.mean{color:var(--fg)}
.ex{font-family:var(--f-jp);color:var(--muted);font-size:14px}
.txt{display:grid;gap:1px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.chk:checked+label .form,.chk:checked+label .mean{color:var(--done);text-decoration:line-through;text-decoration-color:var(--done)}
.empty{color:var(--muted);padding:20px 0}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.danger{color:var(--shu);border-color:var(--line)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>文法チェックリスト <span>N5 · N4</span></h1>
    <p>Every grammar point from the two stories (京都の一日 and 大阪の新しい生活). Tick a point once you can use it in your own sentence.</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="Level">
      <button class="tab" id="t-all" data-lv="all" aria-pressed="true">All</button>
      <button class="tab" id="t-n5" data-lv="N5" aria-pressed="false">N5</button>
      <button class="tab" id="t-n4" data-lv="N4" aria-pressed="false">N4</button>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search: ても, passive, because…" aria-label="Search grammar points">
      <button class="tool" id="hide" aria-pressed="false">Hide done</button>
    </div>
    <div class="prog">
      <div class="p n5"><div class="lbl"><b>N5</b><span id="c-N5">0 / 0</span></div><div class="track"><div class="fill" id="f-N5"></div></div></div>
      <div class="p n4"><div class="lbl"><b>N4</b><span id="c-N4">0 / 0</span></div><div class="track"><div class="fill" id="f-N4"></div></div></div>
    </div>
  </div>

  <main id="list"></main>

  <div class="foot">
    <span>Progress is saved in this browser only.</span>
    <button class="tool danger" id="reset">Reset all</button>
    <button class="tool" id="reset-yes" hidden>Yes, clear every tick</button>
  </div>
</div>

<script>
const DATA = {
N5: {
 "Particles": [
  ["は","topic marker","わたしはユキです。"],
  ["が","subject; new info; with 好き/ある/いる","庭に大きい木がありました。"],
  ["を","direct object","パンを食べました。"],
  ["に","time, destination, target, place of existence","七時に起きて… / 母にメールを書きました。"],
  ["へ","direction (towards)","京都へ行きました。"],
  ["で","place of action; means","新幹線で二時間… / ここで靴を脱いで…"],
  ["と","with (a person); and (full list)","ケンさんと / パンとコーヒー"],
  ["も","also, too","外国人もたくさんいました。"],
  ["の","possessive / linking nouns","東京の大学"],
  ["や〜など","A, B and so on (incomplete list)","お茶やおかしなど"],
  ["から / まで","from / until, up to","駅からホテルまで歩きました。"],
  ["か","question marker","撮ってもいいですか。"],
  ["ね","seeking agreement","いいですね。"],
  ["よ","telling new information","いいですよ。"],
  ["には / では","particle + は for contrast or emphasis","お寺には外国人も…"]
 ],
 "Polite forms & copula": [
  ["です / だ","to be (polite / plain)","学生です。"],
  ["〜ます / 〜ません","polite verb, positive / negative","食べます。"],
  ["〜ました / 〜ませんでした","polite past, positive / negative","ありませんでした。"],
  ["じゃありません","noun / な-adj negative","好きじゃありません。"],
  ["だった","plain past of だ","いい一日だった。"],
  ["ある / いる","existence: things / living beings","木がありました / 外国人がいました"]
 ],
 "Adjectives": [
  ["い-adjectives","present, past 〜かった, negative 〜くない","少ない / 暑かった"],
  ["な-adjectives","need な before nouns","きれいな町"],
  ["〜くて / 〜で","connect adjectives (and)","静かで、きれい / おいしくて、安かった"],
  ["〜くなる / 〜になる","to become","空が暗くなりました。"],
  ["〜く (adverb)","い-adj used as an adverb","早く寝ました。"]
 ],
 "Verb patterns": [
  ["て-form (sequence)","do A, then B","起きて、食べました"],
  ["〜てから","after doing","食べてから帰りたい"],
  ["〜ている","ongoing action or state","雨が降っています。"],
  ["〜てください","please do","靴を脱いでください。"],
  ["〜ないでください","please don't","撮らないでください。"],
  ["〜てもいい","it's okay to / may","撮ってもいいですか。"],
  ["〜てはいけない","must not","食べてはいけません。"],
  ["〜なければならない","must, have to","行かなければなりません。"],
  ["〜たい","want to do","帰りたいです。"],
  ["〜ませんか","invitation: won't you…?","行きませんか。"],
  ["〜ましょう / 〜ましょうか","let's… / shall we?","帰りましょうか。"],
  ["stem + に行く","go somewhere to do","買いに行きました。"],
  ["〜たり〜たりする","do things like A and B","歩いたり、休んだり"],
  ["〜ながら","while doing","聞きながら"],
  ["〜たことがある","have done before (experience)","来たことがありますか。"],
  ["〜つもり","intend to","読むつもりです。"],
  ["〜前に / 〜の前に","before","昼ご飯の前に"],
  ["〜の後で","after (noun)","昼ご飯の後で"],
  ["〜とき","when","着いたとき"],
  ["〜と言う","say (quote)","…と言いました。"],
  ["もう / まだ〜ていない","already / not yet","まだ送っていません。"]
 ],
 "Comparison": [
  ["〜より","than","東京より人が少ない"],
  ["〜のほうが","A is more…","お寺のほうが好きです。"],
  ["どちらが","which one (of two)","どちらが好きですか。"],
  ["〜の中で〜が一番","the most among…","この中ではこれが一番"]
 ],
 "Other": [
  ["〜が好き / 〜が上手","like / good at","日本語が上手です。"],
  ["〜のが好き","の turns a verb into a noun","撮るのが好きです。"],
  ["〜がほしい","want (a thing)","カメラがほしいです。"],
  ["〜にする","decide on, choose","天ぷらにしました。"],
  ["あまり〜ない","not very","あまり好きじゃありません。"],
  ["しか〜ない","nothing but, only","千円しかありません。"],
  ["〜も〜も","both A and B / neither A nor B","テレビも冷蔵庫も"],
  ["question word + も + negative","nowhere, nothing, nobody","どこへも行きません。"],
  ["〜でしょう","probably","明日は雨でしょう。"],
  ["〜んです","explaining a reason or situation","見たかったんです。"],
  ["〜から (because)","reason","好きですから"],
  ["〜が (but)","contrast","好きですが、…"],
  ["でも","but (at the start of a sentence)","でも、暑かったです。"],
  ["ぐらい / ごろ","about (amount / time)","二時間ぐらい / 七時ごろ"],
  ["counters","つ, 時, 時間…","三つください。"],
  ["question words","どれ, いくら, どう, どうして","いくらですか。"],
  ["こそあど","この/その/あの, ここ/そこ/あそこ","あのお寺 / ここで"]
 ]
},
N4: {
 "Verb forms": [
  ["Potential form","can do (見られる, 話せる)","地図が見られませんでした。"],
  ["Volitional form","let's / shall I (plain)","どうしよう…"],
  ["〜ようと思う","intend to do","言おうと思った"],
  ["Passive","to be done to (by に)","部長に褒められました。"],
  ["Causative-passive","to be made to do","自己紹介をさせられました。"]
 ],
 "て-form combinations": [
  ["〜ておく","do in advance","地図を見ておきました。"],
  ["〜てしまう","do completely / by accident (regret)","迷ってしまいました。"],
  ["〜てみる","try doing","始めてみました。"],
  ["〜てある","state someone created on purpose","メモが貼ってあります。"],
  ["〜てくる","change developing up to now","好きになってきました。"],
  ["〜ていく","action moving away","連れて行って"],
  ["〜ているところ","in the middle of doing","作っているところです。"],
  ["〜たばかり","have just done","着いたばかりの日"]
 ],
 "Giving & receiving": [
  ["〜てくれる","someone does for me","声をかけてくれました。"],
  ["〜てもらう","I receive an action","教えてもらいました。"],
  ["〜ていただく / 〜てくださる","polite もらう / くれる","見ていただきました。"],
  ["〜てほしい","want someone to do","母に来てほしいです。"]
 ],
 "Conditionals": [
  ["〜ば","if; 〜ばいい = should I?","どう行けばいいか"],
  ["〜ばよかった","I should have…","習えばよかった。"],
  ["〜たら","when / if (after completion)","できたら"],
  ["〜と","if X, then Y always follows","まっすぐ行くと、右に…"],
  ["〜なら","if it's about X (advice)","駅なら"],
  ["〜ても","even if","雨が降っても"]
 ],
 "Reasons & contrast": [
  ["〜ので","because (softer, objective)","切れていたので"],
  ["〜のに","although (disappointment)","言おうと思ったのに"],
  ["〜し〜し","listing reasons","優しいし、おいしいし"],
  ["〜ために","in order to (deliberate)","健康のために"],
  ["〜ように","so that (non-controllable / potential)","話せるように"]
 ],
 "Guessing & hearsay": [
  ["〜そう (appearance)","looks like","怖そうに見えます"],
  ["〜そうだ (hearsay)","I heard that","厳しいそうです。"],
  ["〜によると","according to","先輩によると"],
  ["〜らしい","apparently","住んでいたらしいです。"],
  ["〜ようだ / 〜みたい","it seems (formal / casual)","作っているようです / 優しい人みたい"],
  ["〜かもしれない","might","分かりにくいかもしれない"],
  ["〜はず","should be (logical expectation)","慣れるはずよ。"],
  ["〜だろう","probably (plain でしょう)","晴れるだろう。"]
 ],
 "Decisions & changes": [
  ["〜ことになる","it has been decided (by others)","働くことになりました。"],
  ["〜ことにする","I decide","行くことにしました。"],
  ["〜ようにする","make an effort to","充電するようにしています。"],
  ["〜ようになる","come to be able to","分かるようになりました。"]
 ],
 "Other": [
  ["〜すぎる","too much","速すぎて"],
  ["〜やすい / 〜にくい","easy / hard to do","住みやすい / 分かりにくい"],
  ["〜方","how to","やり方"],
  ["〜までに","by (deadline)","三時までに"],
  ["〜間","while, during","作っている間"],
  ["〜ずに","without doing (formal ないで)","言わずに"],
  ["〜かどうか / question word + か","whether / embedded question","いるかどうか"],
  ["〜がする","sense (smell, sound)","いいにおいがします。"],
  ["〜なさい","soft command","食べなさい。"],
  ["〜とか〜とか","things like A and B","たこ焼きとかお好み焼きとか"],
  ["〜でも","…or something (suggestion)","お茶でも飲みませんか。"],
  ["〜たほうがいい","you'd better","大きくしたほうがいい"],
  ["Honorific / humble","おっしゃる / お〜する","おっしゃいました / お作りします"]
 ]
}};

const KEY="jlpt-checklist-v1";
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
let level="all", hideDone=false, query="";
try{const s=JSON.parse(localStorage.getItem(KEY+"-ui")||"{}");if(s.level)level=s.level;if(s.hide)hideDone=true}catch(e){}
const saveUI=()=>{try{localStorage.setItem(KEY+"-ui",JSON.stringify({level,hide:hideDone}))}catch(e){}};

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tick='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

function render(){
  const main=document.getElementById("list"); let html=""; let shown=0;
  for(const lv of ["N5","N4"]){
    if(level!=="all"&&level!==lv) continue;
    let lvHtml="";
    for(const [grp,items] of Object.entries(DATA[lv])){
      let rows="", gDone=0;
      items.forEach((it,i)=>{
        const id=`${lv}-${grp}-${i}`.replace(/[^\w-]/g,"_");
        const isDone=!!done[id]; if(isDone) gDone++;
        if(hideDone&&isDone) return;
        if(query&&!it.join(" ").toLowerCase().includes(query)) return;
        shown++;
        rows+=`<li><input type="checkbox" class="chk" id="${id}" ${isDone?"checked":""}><label for="${id}"><span class="box">${tick}</span><span class="txt"><span class="top"><span class="form">${esc(it[0])}</span><span class="mean">${esc(it[1])}</span></span><span class="ex">${esc(it[2])}</span></span></label></li>`;
      });
      if(rows) lvHtml+=`<section class="group"><h3><span>${esc(grp)}</span><span>${gDone}/${items.length}</span></h3><ul>${rows}</ul></section>`;
    }
    if(lvHtml) html+=`<section class="level"><h2>${lv}<span class="tag">${lv==="N5"?"Beginner":"Lower intermediate"}</span></h2>${lvHtml}</section>`;
  }
  main.innerHTML=html||`<p class="empty">${hideDone?"Everything here is done. Turn off “Hide done” to review.":"No grammar point matches that search."}</p>`;
  progress();
}
function progress(){
  for(const lv of ["N5","N4"]){
    let total=0,d=0;
    for(const [grp,items] of Object.entries(DATA[lv])) items.forEach((_,i)=>{total++; if(done[`${lv}-${grp}-${i}`.replace(/[^\w-]/g,"_")]) d++;});
    document.getElementById("c-"+lv).textContent=`${d} / ${total}`;
    document.getElementById("f-"+lv).style.width=(total?d/total*100:0)+"%";
  }
}
document.getElementById("list").addEventListener("change",e=>{
  if(!e.target.classList.contains("chk")) return;
  if(e.target.checked) done[e.target.id]=1; else delete done[e.target.id];
  save();
  const id=e.target.id; render(); const el=document.getElementById(id); if(el) el.focus({preventScroll:true});
});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
  level=b.dataset.lv; document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t===b)); saveUI(); render();
}));
const hideBtn=document.getElementById("hide");
hideBtn.addEventListener("click",()=>{hideDone=!hideDone; hideBtn.setAttribute("aria-pressed",hideDone); saveUI(); render();});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase(); render();});
const rBtn=document.getElementById("reset"), rYes=document.getElementById("reset-yes");
rBtn.addEventListener("click",()=>{rYes.hidden=!rYes.hidden;});
rYes.addEventListener("click",()=>{done={}; save(); rYes.hidden=true; render();});

document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-pressed",t.dataset.lv===level));
hideBtn.setAttribute("aria-pressed",hideDone);
render();
</script>
</body>
</html>
