<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N3 Grammar Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Same visual system as the N5/N4 checklist: one study column, sticky search + progress, grouped tick lists. N3 uses the deeper 紫 accent to mark the new level */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --fg:#1b2030; --muted:#5c6478; --line:#dde1ea;
  --ai:#2b3f8f; --ai-soft:#e6eaf7; --shu:#c2412d; --murasaki:#6a3d8f; --done:#8a91a3;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"IBM Plex Sans","Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-jp:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151d; --surface:#1a1f2a; --fg:#e7e9f0; --muted:#9aa2b6; --line:#2c3342;
  --ai:#8fa4ef; --ai-soft:#232c48; --shu:#ec7a63; --murasaki:#c19be6; --done:#6b7285; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151d; --surface:#1a1f2a; --fg:#e7e9f0; --muted:#9aa2b6; --line:#2c3342;
  --ai:#8fa4ef; --ai-soft:#232c48; --shu:#ec7a63; --murasaki:#c19be6; --done:#6b7285; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 64px}
nav.site{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:18px}
nav.site a{font:500 14px var(--f-body);text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:8px}
nav.site a:hover{color:var(--fg);background:var(--surface)}
nav.site a[aria-current="page"]{color:var(--ai);background:var(--ai-soft)}
nav.site a.done s{text-decoration-thickness:1.5px}
nav.site a.done .tick{margin-left:4px;color:var(--ai)}
a:focus-visible,button:focus-visible,input:focus-visible,.chk:focus-visible+label{outline:2px solid var(--shu);outline-offset:2px}
header h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.2rem);margin:0;letter-spacing:.01em;text-wrap:balance}
header h1 span{color:var(--murasaki)}
header p{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 12px;margin-top:18px;border-bottom:1px solid var(--line);display:grid;gap:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1 1 200px;min-width:0;font:15px var(--f-body);padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.tool{font:500 13px var(--f-body);background:none;border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer}
.tool[aria-pressed="true"]{color:var(--ai);border-color:var(--ai)}
select.tool{background:var(--surface);color:var(--fg);max-width:100%}
.p{display:grid;gap:4px}
.p .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.p .lbl b{color:var(--fg);font-weight:600}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--murasaki);width:0;transition:width .3s}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
.group{margin-top:22px;scroll-margin-top:150px}
.group h3{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{border-top:1px solid var(--line)}
li:first-child{border-top:0}
.chk{position:absolute;opacity:0;pointer-events:none}
label{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;padding:11px 14px;cursor:pointer;align-items:start}
.box{width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;margin-top:2px;display:grid;place-items:center}
.box svg{width:13px;height:13px;stroke:var(--surface);stroke-width:3;fill:none;opacity:0}
.chk:checked+label .box{background:var(--murasaki);border-color:var(--murasaki)}
.chk:checked+label .box svg{opacity:1}
.form{font-family:var(--f-jp);font-weight:700;font-size:16px}
.mean{color:var(--fg)}
.ex{font-family:var(--f-jp);color:var(--muted);font-size:14px}
.txt{display:grid;gap:1px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.chk:checked+label .form,.chk:checked+label .mean{color:var(--done);text-decoration:line-through;text-decoration-color:var(--done)}
.empty{color:var(--muted);padding:20px 0}
.foot{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px}
.danger{color:var(--shu)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="site" aria-label="Site">
    <a href="./">N5 · N4 checklist</a>
    <a href="conjugations.html">Verb conjugation</a>
    <a href="n5-open-points.html" class="done" title="Done"><s>N5 gaps</s><span class="tick" aria-label="done">✓</span></a>
    <a href="n4-open-points.html" class="done" title="Done"><s>N4 gaps</s><span class="tick" aria-label="done">✓</span></a>
    <a href="n3-checklist.html" aria-current="page">N3 checklist</a>
  </nav>

  <header>
    <h1>文法チェックリスト <span>N3</span></h1>
    <p>The core N3 grammar points, grouped by what they do. Tick a point once you can use it in your own sentence.</p>
  </header>

  <div class="bar">
    <div class="tools">
      <input type="search" id="q" placeholder="Search: わけ, ばかり, despite…" aria-label="Search grammar points">
      <select class="tool" id="jump" aria-label="Jump to group"><option value="">Jump to…</option></select>
      <button class="tool" id="hide" aria-pressed="false">Hide done</button>
    </div>
    <div class="p"><div class="lbl"><b>N3</b><span id="count">0 / 0</span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  </div>

  <main id="list"></main>

  <div class="foot">
    <span>Progress is saved in this browser only.</span>
    <button class="tool danger" id="reset">Reset all</button>
    <button class="tool" id="reset-yes" hidden>Yes, clear every tick</button>
  </div>
</div>

<script>
const DATA = {
 "Time & sequence": [
  ["〜うちに","while (before it changes / ends)","若いうちに、いろいろな国に行きたい。"],
  ["〜最中に","right in the middle of","会議の最中に電話が鳴った。"],
  ["〜たとたん(に)","the moment that","家を出たとたん、雨が降り出した。"],
  ["〜ところに / ところへ","just as (something interrupts)","出かけようとしたところに、友達が来た。"],
  ["〜次第","as soon as","準備ができ次第、出発します。"],
  ["〜てからでないと","not until, only after","説明を聞いてからでないと、決められない。"],
  ["〜てはじめて","only after … (realised)","病気になってはじめて、健康の大切さが分かった。"],
  ["〜以来","ever since","日本に来て以来、ずっと東京に住んでいる。"],
  ["〜たびに","every time","この写真を見るたびに、昔を思い出す。"],
  ["〜ついでに","while you're at it","散歩のついでに、パンを買ってきた。"],
  ["〜かけ","half-done, started but not finished","読みかけの本が机の上にある。"],
  ["〜つつある","in the process of, gradually","町は少しずつ変わりつつある。"],
  ["〜ばかりだ","keeps getting (worse)","物価は上がるばかりだ。"]
 ],
 "Cause & result": [
  ["〜ため(に) (cause)","because of (formal)","事故のため、電車が遅れた。"],
  ["〜せいで","because of (blame)","寝坊したせいで、遅刻した。"],
  ["〜せいか","perhaps because","年のせいか、最近疲れやすい。"],
  ["〜おかげで","thanks to","先生のおかげで、合格できました。"],
  ["〜からこそ","precisely because","好きだからこそ、厳しく言うのだ。"],
  ["〜ものだから / もので","because (excuse)","電車が遅れたものですから、遅くなりました。"],
  ["〜によって","depending on, by, due to","国によって習慣が違う。"],
  ["〜わけだ","no wonder, that means","十年住んでいたのか。上手なわけだ。"],
  ["〜わけではない","it doesn't mean that","嫌いなわけではないが、あまり食べない。"],
  ["〜わけがない","there's no way","あんなに練習したんだから、負けるわけがない。"],
  ["〜わけにはいかない","can't (for social reasons)","明日は試験だから、休むわけにはいかない。"]
 ],
 "Conditions & concession": [
  ["〜ば〜ほど","the more … the more","練習すればするほど、上手になる。"],
  ["〜さえ〜ば","if only, as long as","時間さえあれば、もっと旅行したい。"],
  ["〜としたら / とすれば","supposing that","宝くじが当たったとしたら、何をしますか。"],
  ["〜としても","even if (supposing)","今から行ったとしても、間に合わないだろう。"],
  ["たとえ〜ても","even if","たとえ雨が降っても、行きます。"],
  ["〜くせに","even though (criticism)","知っているくせに、教えてくれない。"],
  ["〜にもかかわらず","despite","雨にもかかわらず、たくさんの人が来た。"],
  ["〜からといって","just because … doesn't mean","高いからといって、いい物とは限らない。"],
  ["〜とは限らない","not necessarily","日本人がみんな寿司が好きだとは限らない。"],
  ["〜ないことはない","it's not that … not","食べられないことはないが、好きではない。"],
  ["〜ところだった","almost happened","もう少しで車にぶつかるところだった。"],
  ["〜ばいいのに","I wish … would","もっと早く言えばいいのに。"]
 ],
 "Degree & comparison": [
  ["〜ほど / くらい","to the extent that","泣きたいくらい嬉しかった。"],
  ["〜ほど〜ない","not as … as","今年の夏は去年ほど暑くない。"],
  ["〜ほど〜はない","nothing is as … as","家族ほど大切なものはない。"],
  ["〜に比べて","compared to","去年に比べて、雨が多い。"],
  ["〜わりに","considering, for","この店は安いわりに、おいしい。"],
  ["〜にしては","for (unexpectedly)","初めてにしては、上手ですね。"],
  ["〜っぽい","-ish, seems like","この服はちょっと子供っぽい。"],
  ["〜がち","tend to (bad)","冬は風邪をひきがちだ。"],
  ["〜気味","slightly, a touch of","最近、疲れ気味です。"],
  ["〜だらけ","full of, covered in","部屋がごみだらけだ。"],
  ["〜さえ / すら","even","忙しくて、水を飲む時間さえない。"],
  ["〜こそ","this very, precisely","今年こそ、N3に合格したい。"],
  ["〜だけでなく / ばかりでなく","not only … but also","彼は英語だけでなく、中国語も話せる。"],
  ["〜うえ(に)","on top of that","この店は安いうえに、おいしい。"],
  ["〜に加えて","in addition to","雨に加えて、風も強くなってきた。"],
  ["〜に限る","nothing beats","疲れた時は、寝るに限る。"]
 ],
 "Topic & viewpoint": [
  ["〜について","about","日本の文化について調べた。"],
  ["〜に関して","regarding (formal)","この件に関して、質問があります。"],
  ["〜にとって","for (from the view of)","私にとって、家族が一番大切だ。"],
  ["〜として","as (a role)","留学生として日本に来た。"],
  ["〜に対して","towards; in contrast to","先生に対して失礼なことを言ってしまった。"],
  ["〜といえば / というと","speaking of","日本といえば、富士山ですね。"],
  ["〜って (topic)","casual は, \"as for\"","田中さんって、優しいね。"],
  ["〜とは / 〜というのは","the definition of","「積ん読」とは、買った本を読まずにためておくことだ。"],
  ["〜からすると","judging from","彼の顔からすると、怒っているようだ。"],
  ["〜をはじめ","starting with, including","東京をはじめ、大きな町はどこも人が多い。"],
  ["〜を中心に","centred on","若者を中心に人気がある。"],
  ["〜に代わって","in place of, on behalf of","社長に代わって、私がご挨拶します。"],
  ["〜向け / 〜向き","aimed at / suited to","子供向けの本。この仕事は彼に向いている。"]
 ],
 "Change & proportion": [
  ["〜につれて","as (gradual change)","時間がたつにつれて、悲しみも消えていった。"],
  ["〜にしたがって","as, in line with","上に行くにしたがって、寒くなる。"],
  ["〜とともに","together with; as","年をとるとともに、体力が落ちる。"],
  ["〜一方(で)","while, on the other hand","便利になった一方で、問題も増えた。"],
  ["〜かわりに","instead of; in exchange","手伝うかわりに、昼ご飯をおごってね。"]
 ],
 "Judgment & certainty": [
  ["〜べきだ / べきではない","should / shouldn't","約束は守るべきだ。"],
  ["〜に違いない","must be, no doubt","電気がついている。家にいるに違いない。"],
  ["〜に決まっている","surely, of course","そんな話、嘘に決まっている。"],
  ["〜はずがない","there's no way that","彼が嘘をつくはずがない。"],
  ["〜おそれがある","there's a risk of","台風が来るおそれがある。"],
  ["〜ことはない","there's no need to","心配することはないよ。"],
  ["〜しかない","have no choice but","終電がないから、歩いて帰るしかない。"],
  ["〜ないわけにはいかない","have to (can't not)","招待されたから、行かないわけにはいかない。"],
  ["〜ようがない","no way to","連絡先が分からないので、連絡しようがない。"],
  ["〜ものだ","naturally; used to (nostalgia)","子供の頃は、よくここで遊んだものだ。"],
  ["〜ことだ","the best thing is to (advice)","上手になりたければ、毎日練習することだ。"],
  ["〜てしょうがない / てたまらない","unbearably","暑くてたまらない。"]
 ],
 "Appearance, hearsay & feeling": [
  ["〜ように見える","looks like, seems","彼は疲れているように見える。"],
  ["〜気がする","have a feeling that","前にどこかで会ったような気がする。"],
  ["〜げ","seeming, with an air of","彼女は寂しげな顔をしていた。"],
  ["〜ふりをする","pretend to","弟は寝ているふりをした。"],
  ["〜ということだ","I heard; that means","明日の会議は中止だということだ。"],
  ["〜とか (hearsay)","I heard something like","来週、雪が降るとか。"],
  ["〜という + noun","called, the fact that","「さくら」という店を知っていますか。"],
  ["〜なんて","such a thing as (surprise)","彼が結婚するなんて、信じられない。"],
  ["〜なんか / など","things like (modest, dismissive)","私なんか、まだまだです。"],
  ["〜っけ","was it …? (recalling)","会議は何時からだっけ？"]
 ],
 "Actions & attempts": [
  ["〜ようとする","try to; be about to","ドアを開けようとしたが、開かなかった。"],
  ["〜ようとしない","refuse to, won't","子供が野菜を食べようとしない。"],
  ["〜させてください / させていただく","let me (humble)","この仕事は私にやらせてください。"],
  ["〜てもらいたい","want someone to","一度会ってもらいたい人がいる。"],
  ["〜ように言う / 頼む","tell / ask someone to","先生は静かにするように言った。"],
  ["〜てばかりいる","do nothing but","弟はゲームをしてばかりいる。"],
  ["〜っぱなし","leave as is (left on)","電気をつけっぱなしにしてしまった。"],
  ["〜きる","do completely","一日で本を読みきった。"],
  ["〜だす","suddenly start","急に雨が降りだした。"],
  ["〜合う","do to each other","二人は助け合っている。"],
  ["〜ずに済む / ないで済む","get by without","友達が手伝ってくれたので、お金を払わずに済んだ。"]
 ],
 "Written & casual style": [
  ["〜である","is (written style)","日本は島国である。"],
  ["〜ず(に) (written)","without, not (written)","何も言わず、部屋を出ていった。"],
  ["〜ちゃう / じゃう","casual てしまう","ケーキ、全部食べちゃった。"],
  ["〜とく","casual ておく","レストラン、予約しとくね。"],
  ["〜なきゃ / なくちゃ","casual must","もう行かなきゃ。"],
  ["〜って (quote)","casual と言っていた","明日、休みだって。"]
 ]
};

const KEY="jlpt-n3-checklist-v1";
let done={};
try{done=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){done={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
let hideDone=false, query="";
try{hideDone=localStorage.getItem(KEY+"-hide")==="1"}catch(e){}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const idOf=(grp,i)=>`N3-${grp}-${i}`.replace(/[^\w-]/g,"_");
const gid=grp=>"g-"+grp.replace(/[^\w]/g,"_");
const tick='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';

const jump=document.getElementById("jump");
Object.keys(DATA).forEach(g=>{const o=document.createElement("option");o.value=gid(g);o.textContent=g;jump.appendChild(o)});
jump.addEventListener("change",()=>{const el=document.getElementById(jump.value);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});jump.value=""});

function render(){
  let html="";
  for(const [grp,items] of Object.entries(DATA)){
    let rows="", gDone=0;
    items.forEach((it,i)=>{
      const id=idOf(grp,i), isDone=!!done[id]; if(isDone) gDone++;
      if(hideDone&&isDone) return;
      if(query&&!it.join(" ").toLowerCase().includes(query)) return;
      rows+=`<li><input type="checkbox" class="chk" id="${id}" ${isDone?"checked":""}><label for="${id}"><span class="box">${tick}</span><span class="txt"><span class="top"><span class="form">${esc(it[0])}</span><span class="mean">${esc(it[1])}</span></span><span class="ex">${esc(it[2])}</span></span></label></li>`;
    });
    if(rows) html+=`<section class="group" id="${gid(grp)}"><h3><span>${esc(grp)}</span><span>${gDone}/${items.length}</span></h3><ul>${rows}</ul></section>`;
  }
  document.getElementById("list").innerHTML=html||`<p class="empty">${hideDone?"Everything here is done. Turn off “Hide done” to review.":"No grammar point matches that search."}</p>`;
  let total=0,d=0;
  for(const [grp,items] of Object.entries(DATA)) items.forEach((_,i)=>{total++; if(done[idOf(grp,i)]) d++;});
  document.getElementById("count").textContent=`${d} / ${total}`;
  document.getElementById("fill").style.width=(total?d/total*100:0)+"%";
}
document.getElementById("list").addEventListener("change",e=>{
  if(!e.target.classList.contains("chk")) return;
  if(e.target.checked) done[e.target.id]=1; else delete done[e.target.id];
  save(); const id=e.target.id; render(); const el=document.getElementById(id); if(el) el.focus({preventScroll:true});
});
const hideBtn=document.getElementById("hide");
hideBtn.setAttribute("aria-pressed",hideDone);
hideBtn.addEventListener("click",()=>{hideDone=!hideDone;hideBtn.setAttribute("aria-pressed",hideDone);try{localStorage.setItem(KEY+"-hide",hideDone?"1":"0")}catch(e){};render()});
document.getElementById("q").addEventListener("input",e=>{query=e.target.value.trim().toLowerCase();render()});
const rBtn=document.getElementById("reset"), rYes=document.getElementById("reset-yes");
rBtn.addEventListener("click",()=>{rYes.hidden=!rYes.hidden});
rYes.addEventListener("click",()=>{done={};save();rYes.hidden=true;render()});
render();
</script>
</body>
</html>
